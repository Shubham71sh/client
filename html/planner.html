<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/planner.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            Daily Manager
        </div>
        <ul class="nav-links">
            <li><a href="/client/html/index.html">Dashboard</a></li>
            <li><a href="/client/html/habit.html">Habits</a></li>
            <li><a href="/client/html/planner.html">Planner</a></li>
            <li><a href="/client/html/notes.html">Notes</a></li>
            <li><a href="/client/html/progress.html">Progress</a></li>
            <li><a href="/client/html/profile.html">Profile</a></li>
        </ul>
    </nav>
    <main class="container">
        <header class="page-header fade-in">
            <h1 id="greeting-message">Daily Planner</h1>
            <p id="current-date">Organize your day with a simple schedule planner.</p>
        </header>
        <div class="card">
            <div class="input-container">
                <form action="">
                    <input type="text" id="planner-input" placeholder="What do you need to do?">
                    <input type="text" id="planner-time" placeholder="12:30 PM">
                    <button id="add-planner-btn">Add Task</button>
                </form>
                <ul class="item-list" id="planner-list">
                    <!-- div list -->
                </ul>
            </div>
        </div>
    </main>
    <script src="../js/global.js"></script>
    <script src="../js/planner.js"></script>
</body>
</html>
